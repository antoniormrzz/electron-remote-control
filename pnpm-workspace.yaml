packages:
  - apps/*
  - libs/*

allowBuilds:
  electron: true
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true
  robotjs: true
  sharp: true

blockExoticSubdeps: false
disallowWorkspaceCycles: true
nodeLinker: hoisted
strictPeerDependencies: true
savePrefix: ''
minimumReleaseAgeExclude:
  - eslint-plugin-react-refresh@0.5.6
