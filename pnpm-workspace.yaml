packages:
  - apps/*
  - libs/*

allowBuilds:
  electron: true
  fs-xattr: true
  macos-alias: true
  robotjs: true
  sharp: true

blockExoticSubdeps: false
disallowWorkspaceCycles: true
nodeLinker: hoisted
strictPeerDependencies: true
savePrefix: ''

overrides:
  '@electron/get>undici': 7.30.2
  '@electron/rebuild>node-gyp': 13.1.0
  'appdmg>image-size': 2.2.0
  'electron-installer-common>@electron/asar': 4.3.4
  'electron-installer-common>glob': 14.0.6
  'express>body-parser': 2.4.0
  'qs@6.16.0': 6.17.1
  'zod@4.5.4': 4.6.7
patchedDependencies:
  appdmg@0.6.6: patches/appdmg@0.6.6.patch
  electron-installer-common@0.10.4: patches/electron-installer-common@0.10.4.patch
