name: Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/desktop/scripts/verify-release-tag.mjs "$RELEASE_TAG"

  build:
    needs: metadata
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: electremote-macos-arm64
            extensions: dmg
          - runner: macos-15-intel
            artifact: electremote-macos-x64
            extensions: dmg
          - runner: windows-latest
            artifact: electremote-windows-x64
            extensions: zip
          - runner: ubuntu-24.04
            artifact: electremote-linux-x64
            extensions: deb rpm
          - runner: ubuntu-24.04-arm
            artifact: electremote-linux-arm64
            extensions: deb rpm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Make distribution packages
        run: pnpm make
      - name: Verify RobotJS resource
        shell: bash
        run: test -f "apps/desktop/resources/robotjs/node.napi.node"
      - name: Verify release artifacts
        shell: bash
        env:
          REQUIRED_EXTENSIONS: ${{ matrix.extensions }}
        run: |
          read -ra extensions <<< "$REQUIRED_EXTENSIONS"
          for extension in "${extensions[@]}"; do
            artifact="$(find apps/desktop/out/make -type f -name "*.$extension" -print -quit)"
            if [[ -z "$artifact" ]]; then
              printf 'Missing release artifact: .%s\n' "$extension" >&2
              exit 1
            fi
            printf 'Found %s\n' "$artifact"
          done
      - name: Launch Electremote from the Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $archive = "apps/desktop/out/make/zip/win32/x64/Electremote-win32-x64-$version.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'electremote-windows-smoke'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Join-Path $destination 'resources/robotjs/node.napi.node'
          node -e "require(process.argv[1])" $binary
          if ($LASTEXITCODE -ne 0) {
            throw 'The packaged RobotJS binary failed to load.'
          }

          $exe = Join-Path $destination 'Electremote.exe'
          $app = Start-Process -FilePath $exe -WorkingDirectory $destination -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              $app.Refresh()
              if ($app.HasExited) {
                throw "Electremote exited before serving requests (exit code: $($app.ExitCode))."
              }
              $listener = Get-NetTCPConnection -State Listen |
                Where-Object { $_.OwningProcess -eq $app.Id -and $_.LocalAddress -eq '0.0.0.0' } |
                Select-Object -First 1
              if ($listener) {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$($listener.LocalPort)/" -SkipHttpErrorCheck -TimeoutSec 5
                if ($response.StatusCode -ne 403) {
                  throw "Expected the remote page to reject an unauthenticated request, got $($response.StatusCode)."
                }
                Write-Host 'Electremote launched and the remote server responded.'
                break
              }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            if (-not $listener) {
              throw 'Electremote did not start its remote server within 45 seconds.'
            }
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id
            }
          }
      - name: Verify macOS disk image mounts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          arch="$(node -p 'process.arch')"
          image="apps/desktop/out/make/Electremote-$version-$arch.dmg"
          hdiutil verify "$image"
          mountpoint="$(mktemp -d)"
          trap 'rmdir "$mountpoint"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$image"
          trap 'hdiutil detach "$mountpoint" && rmdir "$mountpoint"' EXIT
          app="$mountpoint/Electremote.app"
          codesign --verify --deep --strict "$app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Electremote" \
            -e 'require(process.argv[1])' "$app/Contents/Resources/robotjs/node.napi.node"
      - name: Verify Linux package contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case "$(node -p 'process.arch')" in
            x64) deb_arch=amd64; rpm_arch=x86_64 ;;
            arm64) deb_arch=arm64; rpm_arch=aarch64 ;;
            *) echo 'Unexpected Linux runner architecture.' >&2; exit 1 ;;
          esac
          deb="$(find apps/desktop/out/make/deb -type f -name '*.deb' -print -quit)"
          rpm="$(find apps/desktop/out/make/rpm -type f -name '*.rpm' -print -quit)"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$deb_arch"
          test "$(rpm -qp --qf '%{ARCH}' "$rpm")" = "$rpm_arch"
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - | grep -E '/resources/robotjs/node\.napi\.node$'
          rpm -qpl "$rpm" | grep -E '/resources/robotjs/node\.napi\.node$'
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: electremote-*
          path: release-artifacts
      - name: Stage unique release assets and create checksums
        shell: bash
        run: |
          mkdir release-assets
          find release-artifacts -type f -print0 | while IFS= read -r -d '' asset; do
            name="${asset##*/}"
            if [[ "$name" == SHA256SUMS || -e "release-assets/$name" ]]; then
              printf 'Duplicate or reserved release asset name: %s\n' "$name" >&2
              exit 1
            fi
            mv -- "$asset" "release-assets/$name"
          done
          cd release-assets
          shopt -s nullglob
          assets=(*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'No release assets to publish.' >&2
            exit 1
          fi
          sha256sum -- "${assets[@]}" > SHA256SUMS
      - name: Create release notes header
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            printf '%s\n' '> [!WARNING]'
            printf '> The macOS builds are not Developer ID signed or notarized, and the Windows build is not Authenticode signed. See the [installation instructions](https://github.com/%s/blob/%s/docs/DISTRIBUTION.md) for Gatekeeper and SmartScreen warnings.\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '\n'
          } > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          tag_type="$(git cat-file -t "$tag_ref")"
          publish=false
          if [[ "$tag_type" == tag ]]; then
            annotation="$(git for-each-ref --format='%(contents)' "$tag_ref")"
            if grep -Fxq 'Publish-Release: true' <<< "$annotation"; then
              publish=true
            fi
          fi

          assets=(release-assets/*)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --draft \
            --generate-notes \
            --notes-file release-notes.md \
            --title "Electremote $RELEASE_TAG" \
            --verify-tag
          if [[ "$publish" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
